name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Unit tests (emulated WoW API)
        run: lua5.1 tests/run_tests.lua
      - name: HereBeDragons smoke test
        run: lua5.1 tests/hbd_smoke.lua

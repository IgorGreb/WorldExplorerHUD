name: Release

# Push a tag like v0.7.0 to build the zip and upload it to
# GitHub Releases, CurseForge and Wago (whichever have credentials configured).
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for the changelog / version

      - name: Luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: .

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Tests
        run: |
          lua5.1 tests/run_tests.lua
          lua5.1 tests/hbd_smoke.lua

      - name: Package and upload
        uses: BigWigsMods/packager@v2
